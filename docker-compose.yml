services:
  db:
    image: pgvector/pgvector:pg16
    container_name: satyavani_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mySecretPass}
      POSTGRES_DB: ${POSTGRES_DB:-satyavani_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-satyavani_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: satyavani_app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
